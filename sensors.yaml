# Sensor suite for Exercise 4: lean private car, city + highway (redesign of 2026-11-24).
# Only the Hesai OT128 was used by an earlier group (reuse is allowed for a few sensors; see PLAN.md).
#
# Vehicle frame: origin at the car's centre on the ground, x forward, y left, z up [m]; yaw in deg (0 = forward, +90 = left).
# Car body: 4.8 m long x 1.9 m wide x 1.5 m high.
# Each entry has an official source. "source_kind" says what that source is:
#   datasheet = manufacturer datasheet/manual, product_page = manufacturer spec web page.
# Prices: listed prices where a source gives one, otherwise rough estimates (marked _est); the total is reported, no target.

vehicle: {length: 4.8, width: 1.9, height: 1.5}

models:
  # ---------------- lidar ----------------
  innoviz_two:
    modality: lidar
    name: Innoviz InnovizTwo (Condor configuration)
    source: InnovizTwo GMSL Series Production Datasheet v3.1 (2024), also used in Exercise 3
    source_kind: datasheet
    wavelength_nm: 905
    hfov: 120
    vfov: 28.8            # active vertical FOV (43 addressable)
    res_h: 0.1            # ROI (central 30 x 9.6 deg)
    res_v: 0.05
    range_10pct: 210      # ROI, 90 % true positives per pixel, 100 klx
    roi_hfov: 30
    side_fov: {res_h: 0.2, res_v: 0.05, range_10pct: 140}   # Condor side FOV (45 deg each side of the ROI)
    range_max: 300
    range_min: 0.3
    range_accuracy: 0.10  # long-range bias
    fps: 20
    price_usd_est: 1000
  hesai_ot128:
    modality: lidar
    name: Hesai OT128 (360 deg mechanical, roof)
    source: Hesai OT128 User Manual, doc version O01-en-260110 (section 1.6 Specifications, Appendix A.1 channel table)
    source_kind: datasheet
    wavelength_nm: 905
    hfov: 360
    vfov: 40              # 1.6: 40 deg (-25 to +15 deg)
    vfov_down: 25
    res_h: 0.1            # 1.6: 0.1/0.2 deg at 10 Hz (high-res channels 25-88 / the others)
    res_v: 0.125          # 1.6: finest, channels 24-89
    range_10pct: 200      # 1.6: 1-200 m at 10 %, 100 klux, PoD > 70 % (far-field channels 33-64; per channel in the CSV)
    p0: 0.70              # A.1: probability of detection at the 10 % range
    channels: hesai_ot128_channels.csv   # A.1: elevation, min/max instrumented range, 10 % range per channel
    range_min: 0.3        # 1.6: instrumented range 0.3-230 m (0.3 m on near-field channels, 1.4 m on the others)
    range_max: 230
    range_accuracy: 0.03  # 1.6: +-3 cm (3 to 200 m, typical)
    points_per_s: 3456000 # 1.6: single return
    power_w: 29
    fps: 10               # 1.6: 10 Hz or 20 Hz; we use 10 Hz (finer horizontal resolution)
    price_usd_est: 3000

  # ---------------- radar ----------------
  smartmicro_drvegrd171:
    modality: radar
    name: smartmicro DRVEGRD 171 (4D/PxHD, 76-77 GHz)
    source: DRVEGRD 171 Automotive Datasheet, 2 June 2026 (s.m.s smart microwave sensors GmbH) + DRVEGRD 152 & 171 product sheet
    source_kind: datasheet
    freq_ghz: 76.5
    hfov: 100             # -50..+50 deg
    vfov: 20              # -10..+10 deg
    # Extra-long-range car range: 240 m (product sheet "Detection Range Passenger Car 240 m / 787.40 ft"; datasheet text
    # "up to 240m"). The June 2026 datasheet table cell reads "180m | 787.4ft", which contradicts its own 787.4 ft
    # (= 240 m); 180 m is the DRVEGRD 152's figure, so we read it as a copy error.
    modes:                # [max range m (passenger car, boresight), range accuracy m, speed accuracy m/s, min range m]
      extra_long:   [240, 0.6,  0.07, 1.2]
      extra_medium: [98,  0.25, 0.07, 0.5]
      short:        [42,  0.1,  0.14, 0.2]
    operating_modes: [extra_long, short]   # our choice: interleaved cycles (55 + 40 ms); modes switch at runtime
    az_accuracy: 0.25
    el_accuracy: 0.5
    az_separation: 2.0    # "not available yet" per datasheet footnote 8; don't quote as achieved
    cycle_ms: 55
    price_usd_est: 400

  # ---------------- camera ----------------
  supertek_ox08b40_h30:
    modality: camera
    name: Supertek STC-OX08BC-5300-GMSL2-H30S1 (OmniVision OX08B40, 8.3 MP)
    source: supertekmodule.com 8MP GMSL2 camera page + datasheet; OX08B40 product brief v1.1 (OmniVision)
    source_kind: datasheet
    sensor: OX08B40
    resolution: [3840, 2160]
    pixel_um: 2.1
    hdr_db: 140           # sensor product brief
    hfov: 30
    vfov: 16
    focal_mm: 15.3
    fps: 30
    price_usd_est: 300
  supertek_ox08b40_h60:
    modality: camera
    name: Supertek STC-OX08BC-5300-GMSL2-H60S (OX08B40)
    source: as above
    source_kind: datasheet
    sensor: OX08B40
    resolution: [3840, 2160]
    pixel_um: 2.1
    hdr_db: 140
    hfov: 60
    vfov: 33
    focal_mm: 7.87
    fps: 30
    price_usd_est: 300
  supertek_ox08b40_h120:
    modality: camera
    name: Supertek STC-OX08BC-5300-GMSL2-H120YA (OX08B40)
    source: as above
    source_kind: datasheet
    sensor: OX08B40
    resolution: [3840, 2160]
    pixel_um: 2.1
    hdr_db: 140
    hfov: 120
    vfov: 66
    focal_mm: 4.01
    fps: 30
    price_usd_est: 300
  sensing_isx031_h190:
    modality: camera
    name: SENSING SG3S-ISX031C-GMSL2F-H190XA fisheye (Sony ISX031, 3 MP)
    source: SENSING SG3S-ISX031C-GMSL2F datasheet (Seeed Studio product datasheet, SKU 101090101)
    source_kind: datasheet
    sensor: ISX031
    resolution: [1920, 1536]
    pixel_um: 3.0
    hdr_db: 120           # ISX031 sensor figure (Waveshare ISX031 module page); SENSING datasheet only says "HDR support"
    hfov: 196
    vfov: 154
    fps: 30
    price_usd: 459        # listed on the datasheet (2026-11-11)

  # ---------------- thermal ----------------
  raytron_horus640d_13:
    modality: thermal
    name: Raytron Horus640-D automotive LWIR module, 13.5 mm F1.0 lens
    source: Horus640-D Automotive Thermal Imaging Product Manual V1.1 (Raytron, 21 Nov 2024)
    source_kind: datasheet
    # Lens: the 13.5 mm F1.0 is in the manual's Table 2-2 (compatible lenses). Raytron's one pre-configured model,
    # HRS-D640I03123048F11C2, carries the 9.1 mm F1.1 lens (48 x 37 deg); other combinations are built on request.
    band_um: [8, 14]
    resolution: [640, 512]
    pixel_um: 12
    netd_mk: 35           # @25 C, F#1.0
    hfov: 32
    vfov: 26
    ifov_mrad: 0.8
    fps: 30
    pedestrian_identify_m: 169   # Johnson criteria, 1.8 x 0.5 m pedestrian (manual table 2-2)
    qualification: AEC-Q100 Grade 2 detector and ISP
    price_usd_est: 800

  # ---------------- localisation ----------------
  ublox_zed_f9k:
    modality: gnss_ins
    name: u-blox ZED-F9K-01A (automotive RTK GNSS + IMU dead reckoning) + HD map
    source: ZED-F9K-01A Data Sheet UBX-21045820 (u-blox)
    source_kind: datasheet
    position_rtk_m: 0.2   # < 0.2 m + 1 ppm CEP
    dead_reckoning: "< 1 % of distance travelled without GNSS (u-blox brochure figure)"
    price_usd_est: 250

# Mounts: id, model, x, y, z, yaw. 2 lidars + 5 radars + 11 cameras + 1 thermal + 1 GNSS/INS = 20 sensors.
mounts:
  # lidar: front long-range behind the grille, 360 deg on the roof
  - [L_front,      innoviz_two,           2.35,  0.00, 0.60,    0]
  - [L_roof,       hesai_ot128,           0.00,  0.00, 1.75,    0]
  # radar: front + 4 corners, all interleaving extra-long-range and short-range cycles
  - [R_front,      smartmicro_drvegrd171, 2.40,  0.00, 0.45,    0]
  - [R_fl,         smartmicro_drvegrd171, 2.15,  0.85, 0.45,   50]
  - [R_fr,         smartmicro_drvegrd171, 2.15, -0.85, 0.45,  -50]
  - [R_rl,         smartmicro_drvegrd171,-2.15,  0.85, 0.45,  130]
  - [R_rr,         smartmicro_drvegrd171,-2.15, -0.85, 0.45, -130]
  # camera: front tele + main, 4 side (2 forward-, 2 rearward-looking), rear, 4 near-field fisheyes
  - [C_front_tele, supertek_ox08b40_h30,  0.90,  0.00, 1.40,    0]
  - [C_front_main, supertek_ox08b40_h60,  0.90,  0.10, 1.40,    0]
  - [C_side_lf,    supertek_ox08b40_h120, 0.80,  0.95, 1.10,   70]
  - [C_side_rf,    supertek_ox08b40_h120, 0.80, -0.95, 1.10,  -70]
  - [C_side_lr,    supertek_ox08b40_h120, 0.80,  0.95, 1.10,  140]
  - [C_side_rr,    supertek_ox08b40_h120, 0.80, -0.95, 1.10, -140]
  - [C_rear,       supertek_ox08b40_h60, -2.30,  0.00, 1.00,  180]
  - [F_front,      sensing_isx031_h190,   2.40,  0.00, 0.60,    0]
  - [F_left,       sensing_isx031_h190,   0.90,  0.95, 1.00,   90]
  - [F_right,      sensing_isx031_h190,   0.90, -0.95, 1.00,  -90]
  - [F_rear,       sensing_isx031_h190,  -2.40,  0.00, 0.90,  180]
  # thermal: one forward, narrow lens for night pedestrians at highway stopping distances
  - [T_front,      raytron_horus640d_13,  2.35,  0.25, 0.70,    0]
  # localisation
  - [G_ins,        ublox_zed_f9k,         0.00,  0.00, 0.50,    0]

# Pitch [deg, negative = down] where a sensor is not level. Surround-view fisheyes look down at the ground
# around the car (typical surround-view mounting); all other sensors are level.
pitch: {F_front: -20, F_left: -40, F_right: -40, F_rear: -20}
